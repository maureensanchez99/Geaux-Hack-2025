name: naturequest
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_svg: ^2.0.5
  cupertino_icons: ^1.0.8
  nfc_manager: ^4.1.1
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/ 

  fonts:
    - family: Merienda
      fonts:
        - asset: assets/fonts/Merienda-Regular.ttf
        - asset: assets/fonts/Merienda-Bold.ttf
          weight: 700

flutter_icons:
  android: true  
  ios: true      
  image_path: "assets/logo_icon.png" # Path to your icon image
